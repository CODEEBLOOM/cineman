server:
  port: 8081

spring:
  application:
    name: cineman
  profiles:
    active: @spring.profiles.active@

app:
  mail:
    from-name: Poly Cinemas
    from-address: ${APP_MAIL_FROM:${spring.mail.username:no-reply@localhost}}
    verification-link: ${APP_MAIL_VERIFICATION_LINK:http://localhost:${server.port}${api.path}/auth/confirm-email}

management:
  endpoints:
    web:
      exposure:
        include: '*'

logging:
  level:
    root: INFO
    web: INFO

security:
  authorization:
    enabled: false

