spring:
  config:
    activate:
      on-profile: test
  devtools:
    add-properties: true
  flyway:
    enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/cineman_test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
openapi:
  service:
    api-docs: cineman
    server: ${BACKEND_SERVICE:http://localhost:${server.port}}
    title: Backend service
    version: 1.0.0
jwt:
  secretKey: sontest15@2
