services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=cineman
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cineman"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  backend-service:
    container_name: cineman
    build:
      context: ./
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=dev,docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cineman
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - CINEMA_UPLOAD_FILE_BASE_PATH=file:///app/uploads
      - BACKEND_SERVICE=http://localhost:8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - default

networks:
  default:
    name: cineman

volumes:
  postgres_data:
  uploads_data:
